	<h3>The final boss</h3>

	<div class="quiz" id="#quiz">
		<script type="application/json" class="quiz-data">
		{
			"name": "Recap 2 Quiz",
			"questions": [
				{
					"question": "What will this code log? <editorlite>var x = 10;\n\nfunction test(){\n\tconsole.log(x);\n\tvar x = 5;\n}\n\ntest();</editorlite>",
					"options": [
						"10",
						"5",
						"undefined",
						"ReferenceError"
					],
					"answer": 2,
					"explanation": "Due to hoisting, <code>var x</code> inside the function is declared but not initialized yet, so it logs undefined."
				},
				{
					"question": "What will this code log? <editorlite>var arr = [1,2,3];\n\nfunction modify(a){\n\ta.push(4);\n}\n\nmodify(arr);\nconsole.log(arr);</editorlite>",
						"options": [
						"[1,2,3]",
						"[1,2,3,4]",
						"undefined",
						"Error"
					],
					"answer": 1,
					"explanation": "Arrays are passed by reference, so modifying <code>a</code> affects the original array."
				},
				{
					"question": "What will this code log? <editorlite>var x = 5;\n\nfunction change(){\n\tx = 10;\n}\n\nchange();\nconsole.log(x);</editorlite>",
					"options": [
						"5",
						"10",
						"undefined",
						"Error"
					],
					"answer": 1,
					"explanation": "The function modifies the global <code>var x</code>."
				},
				{
					"question": "What will this code log? <editorlite>function test(){\n\tvar x = 5;\n}\n\ntest();\nconsole.log(x);</editorlite>",
					"options": [
						"5",
						"undefined",
						"ReferenceError",
						"0"
					],
					"answer": 2,
					"explanation": "<code>var x</code> is scoped inside the function and not accessible outside."
				},
				{
					"question": "What will this code log? <editorlite>var arr = [10,20,30];\nconsole.log(arr[arr.length - 1]);</editorlite>",
					"options": [
						"10",
						"20",
						"30",
						"undefined"
					],
					"answer": 2,
					"explanation": "<code>arr.length - 1</code> gives the last index."
				},
				{
					"question": "What will this code log? <editorlite>var result = 0;\n\nfor(var i = 0; i < 3; i++){\n\tresult += i;\n}\n\nconsole.log(result);</editorlite>",
					"options": [
						"3",
						"6",
						"2",
						"0"
					],
					"answer": 0,
					"explanation": "0 + 1 + 2 = 3."
				},
				{
					"question": "What will this code log? <editorlite>function add(a,b){\n\treturn;\n\ta + b;\n}\n\nconsole.log(add(2,3));</editorlite>",
					"options": [
						"5",
						"undefined",
						"Error",
						"NaN"
					],
					"answer": 1,
					"explanation": "<code>return</code> exits immediately. The addition is never executed."
				},
				{
					"question": "What will this code log? <editorlite>var arr = [1,2,3];\nvar newArr = arr.slice(1);\n\nconsole.log(newArr);</editorlite>",
					"options": [
						"[1,2]",
						"[2,3]",
						"[1,2,3]",
						"[2]"
					],
					"answer": 1,
					"explanation": "<code>slice(1)</code> copies from index 1 to the end."
				},
				{
					"question": "What will this code log? <editorlite>var arr = [1,2,3];\narr.splice(1,1);\n\nconsole.log(arr);</editorlite>",
					"options": [
						"[1,2,3]",
						"[1,3]",
						"[2,3]",
						"[1]"
					],
					"answer": 1,
					"explanation": "<code>splice</code> removes 1 element at index 1."
				},
				{
					"question": "What will this code log? <editorlite>var x = '5';\n\nif(x == 5){\n\tconsole.log('A');\n}\n\nif(x === 5){\n\tconsole.log('B');\n}</editorlite>",
					"options": [
						"A",
						"B",
						"A and B",
						"Nothing"
					],
					"answer": 0,
					"explanation": "<code>==</code> does type coercion (true), <code>===</code> does not (false)."
				}
			]
