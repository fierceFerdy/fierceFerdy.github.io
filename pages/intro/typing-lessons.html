	<div class="content">
		<h1>Typing Lessons</h1>
		<p>You'll spend a lot of time behind the keyboard, so it's important to develop good typing habits. Over the coming weeks (or months - depending on your ability) you'll learn to type more efficiently and accurately.</p>
		<h2>Let's explore</h2>
		<ul>
			<li>
				<input type="checkbox" id="step1">
				<label for="step1"> Go to <a target="_blank" href="https://keybr.com">Keybr.com</a></label>
			</li>
			<li>
				<input type="checkbox" id="step2">
				<label for="step2"> Click that pesky cookie popup away</label>
			</li>
			<li>
				<input type="checkbox" id="step3">
				<label for="step3"> Create an account <em>(make sure the window's wide enough)</em></label>
			</li>
			<li>
				<input type="checkbox" id="step4">
				<label for="step4"> Once logged in, click "layouts" on the right side and select "French" <em>(the closest to our layout)</em> on the new page if you don't use <txt>QWERTY</txt>.</label>
			</li>
			<li>
				<input type="checkbox" id="step5">
				<label for="step5"> Click "Practice" to enter practice mode.</label>
			</li>
			<li>
				<input type="checkbox" id="step6">
				<label for="step6"> Make sure you're <strong>always</strong> logged in when practicing.</label>
			</li>
			<li>
				<input type="checkbox" id="step7">
				<label for="step7"> Our initial target is 20 minutes on 3 different days a week.</label>
			</li>
			<li>
				<input type="checkbox" id="step8">
				<label for="step8"> Position your hand as displayed on the picture and try not to look at the keyboard while typing.</label>
			</li>
			<li>
				<input type="checkbox" id="step9">
				<label for="step9"> Hint: While learning how to type it's not speed which matters but consistency.</label>
			</li>
			<li>
				<input type="checkbox" id="step10">
				<label for="step10"> Start practicing your typing skills.</label>
			</li>
		</ul>
